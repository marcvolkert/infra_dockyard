name: Publish postgrest-db image
"on":
  push:
    tags:
      - "v*"
jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fetch release branches
        shell: bash
        run: |
          git fetch --no-tags origin main:refs/remotes/origin/main
          git fetch --no-tags origin dev:refs/remotes/origin/dev || true
      - name: Determine release channel
        id: release
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"

          if git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            CHANNEL="release"
            PRERELEASE="false"
          elif git show-ref --verify --quiet refs/remotes/origin/dev \
            && git merge-base --is-ancestor "$GITHUB_SHA" origin/dev; then
            CHANNEL="prerelease"
            PRERELEASE="true"
          else
            echo "Ref $GITHUB_SHA is not reachable from origin/dev or origin/main."
            echo "Publishing is only allowed for version tags on dev or main lineages."
            exit 1
          fi

          if [[ "$CHANNEL" == "release" && "$VERSION" == *-* ]]; then
            echo "Stable releases on main must use a stable tag such as v1.2.3."
            exit 1
          fi

          if [[ "$CHANNEL" == "prerelease" && "$VERSION" != *-* ]]; then
            echo "Pre-releases on dev must use a pre-release tag such as v1.2.3-beta.1 or v1.2.3-rc.1."
            exit 1
          fi

          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "channel=${CHANNEL}" >> "$GITHUB_OUTPUT"
          echo "prerelease=${PRERELEASE}" >> "$GITHUB_OUTPUT"
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Compute image metadata
        id: vars
        shell: bash
        run: |
          echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/postgrest-db" >> "$GITHUB_OUTPUT"
      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.vars.outputs.image }}
          tags: |
            type=raw,value=${{ steps.release.outputs.version }}
            type=raw,value=latest,enable=${{ steps.release.outputs.channel == 'release' }}
      - name: Build image for vulnerability scan
        uses: docker/build-push-action@v6
        with:
          context: ./postgrest-tandem/image
          file: ./postgrest-tandem/image/Containerfile
          push: false
          load: true
          tags: ${{ steps.vars.outputs.image }}:${{ steps.release.outputs.version }}
          build-args: |
            IMAGE_VERSION=${{ steps.release.outputs.version }}
            VCS_REF=${{ github.sha }}
            SOURCE_URL=${{ github.server_url }}/${{ github.repository }}
            POSTGRES_BASE_TAG=16
      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ steps.vars.outputs.image }}:${{ steps.release.outputs.version }}
          format: table
          exit-code: '1'
          severity: CRITICAL,HIGH
          ignore-unfixed: true
      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: ./postgrest-tandem/image
          file: ./postgrest-tandem/image/Containerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          build-args: |
            IMAGE_VERSION=${{ steps.release.outputs.version }}
            VCS_REF=${{ github.sha }}
            SOURCE_URL=${{ github.server_url }}/${{ github.repository }}
            POSTGRES_BASE_TAG=16
      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: postgrest-db ${{ steps.release.outputs.version }}
          prerelease: ${{ steps.release.outputs.prerelease == 'true' }}
          generate_release_notes: true
