apiVersion: apps/v1
kind: Deployment
metadata:
  namespace: {{ .Values.namespace }}
  name: {{ include "postgrest-tandem.fullname" . }}-postgrest
  labels:
    app: {{ include "postgrest-tandem.fullname" . }}
    component: postgrest
spec:
  replicas: 1
  selector:
    matchLabels:
      app: {{ include "postgrest-tandem.fullname" . }}
      component: postgrest
  template:
    metadata:
      labels:
        app: {{ include "postgrest-tandem.fullname" . }}
        component: postgrest
    spec:
      initContainers:
        - name: wait-for-postgres
          image: postgres:16
          command:
            - sh
            - -c
            - |
              until pg_isready -h {{ include "postgrest-tandem.fullname" . }}-postgres -p {{ .Values.postgres.port }}; do
                echo 'Waiting for PostgreSQL...'
                sleep 2
              done
      containers:
        - name: postgrest
          image: {{ .Values.postgrest.image }}
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: {{ .Values.postgrest.port }}
              name: http
          envFrom:
            - secretRef:
                name: {{ include "postgrest-tandem.fullname" . }}-postgrest
          env:
            - name: PGRST_SERVER_PORT
              value: {{ .Values.postgrest.port | quote }}
          livenessProbe:
            tcpSocket:
              port: {{ .Values.postgrest.port }}
            initialDelaySeconds: 60
            periodSeconds: 10
          readinessProbe:
            tcpSocket:
              port: {{ .Values.postgrest.port }}
            initialDelaySeconds: 15
            periodSeconds: 5
          {{- if .Values.postgrest.resources }}
          resources:
            {{- toYaml .Values.postgrest.resources | nindent 12 }}
          {{- end }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
