apiVersion: v1
kind: Secret
metadata:
  namespace: {{ .Values.namespace }}
  name: {{ include "postgrest-tandem.fullname" . }}-postgres
  labels:
    app: {{ include "postgrest-tandem.fullname" . }}
type: Opaque
stringData:
  POSTGRES_USER: {{ .Values.postgres.username | quote }}
  POSTGRES_DB: {{ .Values.postgres.database | quote }}
  POSTGRES_PASSWORD: {{ .Values.postgres.password | quote }}
  AUTHENTICATOR_PASSWORD: {{ .Values.postgres.authenticatorPassword | quote }}
